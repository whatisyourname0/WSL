name: Virtio sound offline tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/windows/virtiosound/**'
      - 'src/windows/service/exe/**'
      - 'test/windows/virtiosound/**'
      - 'test/windows/common/TestClass.h'
      - 'test/windows/CMakeLists.txt'
      - 'packages.config'
      - '.pipelines/build-job.yml'
      - 'tools/test/virtio-sound-alsa-probe/**'
      - '.github/workflows/virtio-sound-offline-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-tests:
    name: Python ALSA probe mock tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python matching the probe container
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run hardware-independent Python probe tests
        working-directory: tools/test/virtio-sound-alsa-probe
        run: python -m unittest discover -s tests -t . -v

  offline-tests:
    name: Windows CTest suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure standalone test build
        run: |
          $version = (Select-Xml -Path packages.config -XPath '/packages/package[@id="Microsoft.Taef"]/@version').Node.Value
          $package = "${env:RUNNER_TEMP}\taef.zip"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.taef/$version/microsoft.taef.$version.nupkg" -OutFile $package
          Expand-Archive $package -DestinationPath "${env:RUNNER_TEMP}\taef"
          cmake -S src/windows/virtiosound -B "${env:RUNNER_TEMP}\wsl-virtio-sound" -A x64 -DWSL_VIRTIO_SOUND_BUILD_TESTS=ON -DWSL_VIRTIO_SOUND_BUILD_TAEF_TESTS=ON "-DWSL_VIRTIO_SOUND_TAEF_ROOT=${env:RUNNER_TEMP}\taef"

      - name: Build standalone tests
        run: cmake --build "${env:RUNNER_TEMP}\wsl-virtio-sound" --config Release --parallel 2

      - name: Run hardware-independent CTest suites
        run: ctest --test-dir "${env:RUNNER_TEMP}\wsl-virtio-sound" --build-config Release --output-on-failure

      - name: Run the repository TAEF test adapter without WSL setup
        run: |
          & "${env:RUNNER_TEMP}\taef\build\Binaries\x64\TE.exe" "${env:RUNNER_TEMP}\wsl-virtio-sound\taef-tests\Release\wsl_virtio_sound_taef_tests.dll" /name:*VirtioSoundUnitTests* /sessionTimeout:0:05:00
          exit $LASTEXITCODE
